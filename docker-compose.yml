services:
  api:
    image: ${ATLAS_API_IMAGE:-atlas-api:local}
    build: { context: ., dockerfile: Dockerfile.backend }
    env_file: .env
    volumes: [apidata:/data]
    ports: ["4000:4000"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  web:
    image: ${ATLAS_WEB_IMAGE:-atlas-web:local}
    build:
      context: ./frontend
      args: { VITE_API: "${VITE_API:-}", VITE_CHAIN_ID: "${CHAIN_ID}", VITE_INR_PER_ETH: "${INR_PER_ETH:-0}" }
    ports: ["8080:8080"]
    restart: unless-stopped
  clamav:
    image: clamav/clamav:stable
    profiles: ["security"]
    volumes: [clamdb:/var/lib/clamav]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
volumes: { apidata: {}, clamdb: {} }
